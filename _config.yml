plugins:
  - jekyll-seo-tag
  - jekyll-feed

encoding: utf-8

title: Compound Life OS
description: >-
  Ashley's personal operating system for AI, knowledge, growth and investing.
  Building frameworks, running experiments, compounding insights.
author: Ashley

url: "https://ashleyoslab.github.io"
github:
  username: AshleyOSLab

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: post
      permalink: /writing/:categories/:title/

collections:
  systems:
    output: true
    permalink: /systems/:path/
  experiments:
    output: true
    permalink: /experiments/:path/
  notes:
    output: true
    permalink: /notes/:path/

markdown: kramdown
